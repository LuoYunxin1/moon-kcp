name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: moon version --all
      - name: Check formatting
        run: moon fmt --check
      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code -- '**/*.mbti' '**/pkg.generated.mbti'
      - name: Check library
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Build library and examples
        run: |
          moon build --target ${{ matrix.target }} --deny-warn
          moon build examples/codec --target ${{ matrix.target }} --deny-warn
          moon build examples/loopback --target ${{ matrix.target }} --deny-warn
          moon build examples/retransmission --target ${{ matrix.target }} --deny-warn
      - name: Run tests
        run: moon test --target ${{ matrix.target }} --deny-warn
      - name: Run examples
        if: matrix.target == 'wasm-gc'
        run: |
          moon run examples/codec
          moon run examples/loopback
          moon run examples/retransmission